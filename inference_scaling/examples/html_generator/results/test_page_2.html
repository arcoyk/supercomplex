<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f4f4f4;
        }

        header {
            background-color: #333;
            color: #fff;
            padding: 1rem;
        }

        header h1 {
            float: left;
            margin-right: 1rem;
        }

        nav {
            float: right;
        }

        nav a {
            color: #fff;
            text-decoration: none;
            padding: 0.5rem 1rem;
        }

        nav a:hover {
            background-color: #555;
        }

        main {
            width: 90%;
            margin: 2rem auto;
        }

        h2 {
            margin-bottom: 1rem;
        }

        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
        }

        figure {
            margin: 1rem;
            max-width: 30%;
        }

        figcaption {
            text-align: center;
        }

        footer {
            background-color: #333;
            color: #fff;
            padding: 1rem;
            text-align: center;
        }
    </style>
    <title>Portfolio</title>
</head>

<body>
    <header>
        <h1>My Photography Portfolio</h1>
        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>
    </header>
    <main>
        <h2>Welcome to my portfolio!</h2>
        <p>Here you can find some of my best photography work.</p>
        <div class="gallery">
            <figure>
                <img src="photo1.jpg" alt="Photo 1 description">
                <figcaption>Photo 1</figcaption>
            </figure>
            <figure>
                <img src="photo2.jpg" alt="Photo 2 description">
                <figcaption>Photo 2</figcaption>
            </figure>
            <figure>
                <img src="photo3.jpg" alt="Photo 3 description">
                <figcaption>Photo 3</figcaption>
            </figure>
            <figure>
                <img src="photo4.jpg" alt="Photo 4 description">
                <figcaption>Photo 4</figcaption>
            </figure>
        </div>
    </main>
    <footer>
        &copy; 2022 My Photography Portfolio. All rights reserved.
    </footer>
</body>

</html>
