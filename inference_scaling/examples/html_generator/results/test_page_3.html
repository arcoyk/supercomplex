<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pâtisserie Delights - French Bakery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
        }

        header {
            background-color: #4CAF50;
            padding: 1rem;
        }

        header h1 {
            color: white;
            text-align: center;
            margin-bottom: 0;
        }

        main {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            padding: 2rem;
        }

        main .card {
            background-color: white;
            border-radius: 5px;
            box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2);
            width: 30%;
            margin-bottom: 2rem;
            text-align: center;
            padding: 1.5rem;
        }

        main .card img {
            width: 150px;
            height: 150px;
            margin-bottom: 1rem;
        }

        main .card h2 {
            margin-bottom: 0.5rem;
        }

        main .card p {
            line-height: 1.4;
        }

        footer {
            background-color: #4CAF50;
            padding: 1rem;
            text-align: center;
            color: white;
        }
    </style>
</head>
<body>
    <header>
        <h1>Pâtisserie Delights</h1>
    </header>
    <main>
        <div class="card">
            <img src="croissant.jpg" alt="Croissant">
            <h2>Fresh Croissants</h2>
            <p>Delicious, flaky croissants baked daily.</p>
        </div>
        <div class="card">
            <img src="macaron.jpg" alt="Macaron">
            <h2>Colorful Macarons</h2>
            <p>A variety of flavors to choose from.</p>
        </div>
        <div class="card">
            <img src="eclair.jpg" alt="Éclair">
            <h2>Creamy Éclairs</h2>
            <p>Rich and decadent éclairs.</p>
        </div>
    </main>
    <footer>
        Copyright &copy; 2022 Pâtisserie Delights - French Bakery
    </footer>
</body>
</html>
